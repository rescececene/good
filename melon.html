<!doctype html>
<html lang="ko">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<title>멜론 예측 · RESCENE</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --pos: #c62828; --neg: #1a5fb4; --good: #1baf7a;
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300; --s6: #6250d6; --s7: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --pos: #ef7b7b; --neg: #5b9cf0; --good: #199e70;
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --pos: #ef7b7b; --neg: #5b9cf0; --good: #199e70;
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767;
}
:root {
  --tl: #d5d4cd; --bh: #efeee9; --pk: #dcefc8; --night: #e9e9e6; --pred: #efecfb; --predline: #6250d6; --zero: #8e44ad;
  --r1: #fbf5db; --r2: #f9e18c; --r3: #f7c58a; --rx: #faeeee; --r11: #f4e1df; --r21: #f1e0d0; --r31: #eaf1e0; --r41: #dde2f1; --r51: #afc4e3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tl: #3b3b38; --bh: #232322; --pk: #1e3a22; --night: #252524; --pred: #25213f; --predline: #9085e9; --zero: #c39bd3;
    --r1: #3a3520; --r2: #574a17; --r3: #5a3a1a; --rx: #3b2a2b; --r11: #45292b; --r21: #403325; --r31: #2d3828; --r41: #2b3047; --r51: #2a4366;
  }
}
:root[data-theme="dark"] {
  --tl: #3b3b38; --bh: #232322; --pk: #1e3a22; --night: #252524; --pred: #25213f; --predline: #9085e9; --zero: #c39bd3;
  --r1: #3a3520; --r2: #574a17; --r3: #5a3a1a; --rx: #3b2a2b; --r11: #45292b; --r21: #403325; --r31: #2d3828; --r41: #2b3047; --r51: #2a4366;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 56px; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
.lede { margin: 0; font-size: 16px; font-weight: 500; }
.upd { color: var(--ink-2); margin: 2px 0 14px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.up { color: var(--pos); } .down { color: var(--neg); } .zero { color: var(--zero); }
/* 맨 위 요약 — 다음 시간 예상만 */
.sum { max-width: 560px; background: var(--surface); border: 1px solid var(--tl); border-radius: 10px; padding: 4px 14px; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
.sum .row { display: grid; grid-template-columns: 1fr auto 70px; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); }
.sum .row.hd { border-top: 0; padding: 7px 0 5px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.sum .row.hd span:not(:first-child) { text-align: right; }
.sum .nm { font-weight: 650; line-height: 1.3; }
.sum .nm small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }
.sum .v { font-size: 19px; font-weight: 700; text-align: right; }
.sum .vc { text-align: right; line-height: 1.25; }
.sum .vc small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.sum .dv { text-align: right; font-weight: 650; }
.guide { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.guide b { color: var(--ink); font-weight: 650; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(286px, 100%), 1fr)); gap: 12px; margin-bottom: 14px; align-items: start; }
.bp { background: var(--surface); border: 1px solid var(--tl); border-radius: 8px; overflow: hidden; }
.bp .bh { padding: 8px 10px 7px; text-align: center; border-bottom: 1px solid var(--tl); }
.bp .bt { font-size: 16px; font-weight: 700; line-height: 1.3; word-break: keep-all; }
.bp .ba { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.bp.rs .bh { background: #1c2733; border-bottom-color: #1c2733; }
.bp.rs .bt { color: #fff; } .bp.rs .ba { color: #c5d0d9; }
table.b5 { table-layout: fixed; font-size: 13.5px; }
table.b5 th, table.b5 td { text-align: center; padding: 2px; height: 25px; line-height: 1.3; border: 1px solid var(--tl); white-space: nowrap; overflow: hidden; }
table.b5 tr > :first-child { border-left: 0; }
table.b5 tr > :last-child { border-right: 0; }
table.b5 tbody tr:last-child td { border-bottom: 0; }
table.b5 tr.meta th { background: var(--bh); color: var(--ink); font-weight: 600; font-size: 13px; }
table.b5 tr.cols th { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
table.b5 td.t { color: var(--ink-2); }
table.b5 td.d.up { color: var(--pos); }
table.b5 td.d.down { color: var(--neg); }
table.b5 tr.night td { background: var(--night); }
table.b5 tr.pred td { background: var(--pred); border-top: 2px solid var(--predline); height: 32px; }
table.b5 tr.pred td.t { color: var(--ink); font-weight: 650; }
table.b5 tr.pred td.u { font-size: 15px; font-weight: 700; color: var(--ink); }
table.b5 tr.pred td.d { font-weight: 650; }
table.b5 tr td.r1 { background: var(--r1); }
table.b5 tr td.r2 { background: var(--r2); }
table.b5 tr td.r3 { background: var(--r3); }
table.b5 tr td.rx { background: var(--rx); }
table.b5 tr td.r11 { background: var(--r11); }
table.b5 tr td.r21 { background: var(--r21); }
table.b5 tr td.r31 { background: var(--r31); }
table.b5 tr td.r41 { background: var(--r41); }
table.b5 tr td.r51 { background: var(--r51); }
table.b5 tr td.pk { background: var(--pk); }
table.b5 td.d.zero { color: var(--zero); }
table.b5 tr.meta .sat { color: var(--neg); }
table.b5 tr.meta .sun { color: var(--pos); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; line-height: 18px; color: #fff; background: var(--predline); border-radius: 4px; padding: 0 8px; }
.bx { display: none; width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 0; border-top: 1px solid var(--tl); cursor: pointer; }
.kn { padding: 7px 10px; border-top: 1px solid var(--tl); font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 640px) {
  .bp:not(.all) tr.old { display: none; }
  .bx { display: block; }
}
@media (min-width: 641px) {
  table.b5 th, table.b5 td { height: 22px; line-height: 1.2; padding: 1px 2px; }   /* 차트봇 그림처럼 22px 줄 */
  table.b5 tr.pred td { height: 28px; }
  .bp { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; }   /* 제목이 두 줄인 곡이 있어도 세 표 줄이 나란히 */
  .bp .bh { display: flex; flex-direction: column; justify-content: center; }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill { color: #17133a; } }
:root[data-theme="dark"] .pill { color: #17133a; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: inherit; fill: var(--muted); font-size: 11.5px; }
svg .tick { font-variant-numeric: tabular-nums; }
svg .day { fill: var(--ink-2); font-weight: 650; }
svg .note { fill: var(--ink-2); font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .dayline { stroke: var(--axis); stroke-width: 1; }
svg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .ln.fc { stroke-dasharray: 5 5; }
svg .band { opacity: .14; }
svg .now { stroke: var(--ink-2); stroke-width: 1; }
svg .cross { stroke: var(--ink-2); stroke-width: 1; opacity: 0; }
svg .dot { stroke: var(--surface); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.lkey { width: 16px; height: 2px; border-radius: 1px; display: inline-block; background: var(--ink-2); }
.lkey.dash { background: none; height: 0; border-top: 2px dashed var(--ink-2); }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--ink-2); opacity: .25; }
.mult { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 16px; }
.mult h3 { font-size: 13.5px; margin: 0 0 4px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.mult h3 i { width: 10px; height: 10px; border-radius: 50%; }
.tip { position: absolute; pointer-events: none; opacity: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.10); padding: 7px 10px; font-size: 12.5px; min-width: 150px; z-index: 2; transition: opacity .08s; }
.tip.show { opacity: 1; }
.tip .hd { color: var(--ink-2); margin-bottom: 2px; }
.tip b { font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; }
td { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  table.cards tr:first-child { display: none; }
  table.cards tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--border); }
  table.cards td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 2px 0; white-space: normal; text-align: right; }
  table.cards td::before { content: attr(data-label); color: var(--muted); font-size: 12.5px; text-align: left; flex: none; }
  table.cards td:first-child { font-weight: 600; }
  #recent.short tr:nth-child(n+14) { display: none; }
  .more.on { display: block; }
}
.more { display: none; margin: 10px auto 0; padding: 8px 16px; font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.refm { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin: 18px 2px 0; }
.refm div + div { margin-top: 2px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }
.notes { color: var(--ink-2); font-size: 14px; margin: 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
.nv{position:sticky;top:0;z-index:50;display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(28,39,51,.92);backdrop-filter:blur(8px);font:700 13px 'Noto Sans KR',sans-serif}.nv a{color:#dfe7ec;text-decoration:none}.nv a[aria-current]{color:#fff;border-bottom:2px solid #fff}.nv .nv-l{font:400 18px Italiana,serif;letter-spacing:.08em;color:#fff;margin-right:auto}
</style>

<div class="wrap">
  <h1>멜론 이용자수 예측</h1>
  <p class="lede" id="lede">다음 시간 멜론 이용자수를 미리 맞혀 봤어요.</p>
  <p class="upd" id="upd"></p>
  <div class="sum" id="sum"></div>
  <p class="guide" id="guide"><b>표 맨 아래 보라색 줄이 예측</b>이에요.</p>
  <div class="board" id="board"></div>

  <section class="card">
    <h2>그래프로 보기</h2>
    <p class="sub">실선은 실제 숫자, 점선은 예측이에요. 실제 숫자는 대개 옅은 색 띠 안에 들어와요.</p>
    <div class="legend"><span><i class="lkey"></i>실제</span><span><i class="lkey dash"></i>예측</span><span><i class="sw"></i>예측 범위</span></div>
    <div class="mult" id="mult"></div>
  </section>

  <section class="card">
    <h2>얼마나 맞았나</h2>
    <p class="sub" id="statSub"></p>
    <div class="tbl-wrap"><table id="recent" class="cards"></table></div>
    <button type="button" class="more" id="moreRecent">더 보기</button>
  </section>
<!--LOCAL_ONLY-->
  <div class="refm" id="refm"></div>
</div>
<script>
fetch('melon/live.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(D => {
  const NS = 'http://www.w3.org/2000/svg';
  const fmt = n => n == null ? '–' : Math.round(n).toLocaleString('ko-KR');
  const sgn = n => n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
  const tickLab = (v, step) => step >= 10000 ? (v / 10000).toFixed(0) + '만' : step >= 1000 ? (v / 10000).toFixed(1) + '만' : (v / 10000).toFixed(2) + '만';
  const col = s => `var(--s${s.slot % 8})`;
  const lab = h => { const [d, hh] = h.split(' '); return `${+d.slice(5, 7)}.${d.slice(8)} ${+hh}시`; };
  const hr = h => +h.slice(11, 13);
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function txt(p, x, y, s, cls, anchor) { const t = el('text', { x, y, 'text-anchor': anchor || 'start' }, p); if (cls) t.setAttribute('class', cls); t.textContent = s; return t; }
  function h(tag, cls, s) { const e = document.createElement(tag); if (cls) e.className = cls; if (s != null) e.textContent = s; return e; }
  function niceStep(range) { const raw = range / 4; const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p; return 10 * p; }

  const isR = s => /RESCENE|리센느/.test(s.artist || '');
  const lastRank = s => { const r = s.hist.length ? s.hist[s.hist.length - 1][2] : null; return r == null ? 99 : r; };
  const S = D.songs.slice().sort((a, b) => (isR(b) - isR(a)) || (lastRank(a) - lastRank(b)) || (b.base - a.base));   // 리센느 먼저, 그다음 지금 순위
  const NH = hr(D.next);
  const dcls = d => d > 0 ? ' up' : d < 0 ? ' down' : ' zero';
  const dtx = d => d === 0 ? '0' : sgn(d);          // 차트봇은 0 을 '0'(보라)으로
  document.getElementById('lede').textContent = `다음 시간(${NH}시) 멜론 이용자수를 미리 맞혀 봤어요.`;
  { const bh = +D.built.slice(11, 13), bm = +D.built.slice(14, 16), p2 = n => String(n).padStart(2, '0');   // 정기 실행: 매시 6분 · 52분
    const nm = [6, 16, 26, 36, 46, 52, 56].find(x => x > bm);   // 정기 실행 6 · 52분 + 5분 차트 고침 16 · 26 · 36 · 46 · 56분
    const nx = nm != null ? `${p2(bh)}:${p2(nm)}` : `${p2((bh + 1) % 24)}:06`;
    const fv = D.five_posted && D.songs.some(s => s.nc && s.nc.k > 0) ? ` · 5분 차트 ${D.five_posted.slice(11, 16)}까지 반영` : '';
    document.getElementById('upd').textContent = `마지막 업데이트 ${D.built.slice(11)}${fv} · 다음 업데이트 ${nx}쯤 (10분마다)`; }
  document.getElementById('guide').replaceChildren(h('b', null, `표 맨 아래 보라색 줄이 ${NH}시 예측`), document.createTextNode('이에요.'));

  /* 맨 위 요약: 곡마다 다음 시간 예상 숫자와 증감만 */
  const sum = document.getElementById('sum');
  if (S.length) {
    const hd = h('div', 'row hd'); hd.append(h('span', null, '곡'), h('span', null, `${NH}시 예상`), h('span', null, '증감')); sum.appendChild(hd);
    S.forEach(s => {
      const n1 = s.path[0]; if (!n1) return;
      const d = n1.med - s.base, r = h('div', 'row'), nm = h('span', 'nm', s.title);
      if (s.artist) nm.appendChild(h('small', null, s.artist));
      const vc = h('span', 'vc'); vc.appendChild(h('b', 'v', fmt(n1.med)));
      if (s.nc && s.nc.corr) {                       // 5분 차트로 고친 만큼(처음 예측 → 고친 예측)
        const b0 = (s.path_base && s.path_base[0]) ? s.path_base[0].med : n1.med - s.nc.corr;
        vc.appendChild(h('small', 'nc', `처음 ${fmt(b0)} · 5분 차트 ${s.nc.corr > 0 ? '+' : '−'}${fmt(Math.abs(s.nc.corr))}명`));
      }
      r.append(nm, vc, h('span', 'dv' + dcls(d), dtx(d)));
      sum.appendChild(r);
    });
  } else sum.appendChild(h('div', 'empty', '지금 실시간 3위 안에 숫자가 있는 곡이 없어요.'));

  /* 차트봇 '이용자수 추이' 표 꼴 — 곡마다 최근 25시간 + 맨 아래 예측 줄 */
  const WK = '일월화수목금토';
  const dlab = t => `${t.slice(0, 4)}.${t.slice(5, 7)}.${t.slice(8, 10)}(${WK[new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10)).getDay()]})`;
  const rc = v => v == null ? '' : v <= 1 ? 'r1' : v === 2 ? 'r2' : v === 3 ? 'r3' : v <= 10 ? 'rx'
    : v <= 20 ? 'r11' : v <= 30 ? 'r21' : v <= 40 ? 'r31' : v <= 50 ? 'r41' : 'r51';     // 차트봇 칸 색 9단계
  const ds = t => { const w = new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10)).getDay(); return h('span', w === 6 ? 'sat' : w === 0 ? 'sun' : null, dlab(t)); };
  const board = document.getElementById('board');
  S.forEach(s => {
    const all = s.hist.slice(-26);                     // 맨 앞 한 줄은 첫 줄 증감 계산에만 씀(표엔 25시간)
    const rows = all.slice(1);
    while (rows.length && rows[0][1] == null && rows[0][2] == null && rows[0][3] == null) rows.shift();   // 새 곡: 나오기 전 시간은 뺌
    const p = h('div', 'bp' + (isR(s) ? ' rs' : ''));
    const bh = h('div', 'bh'); bh.append(h('div', 'bt', s.title), h('div', 'ba', s.artist || '')); p.appendChild(bh);
    const tb = h('table', 'b5');
    const cg = document.createElement('colgroup');
    [15, 12, 13, 32, 28].forEach(w => { const c = document.createElement('col'); c.style.width = w + '%'; cg.appendChild(c); });
    tb.appendChild(cg);
    const n1 = s.path[0];
    const thd = document.createElement('thead');
    const addTh = (cls, cells) => { const r = document.createElement('tr'); r.className = cls; cells.forEach(([x, span]) => { const c = h('th', null, x); if (span) c.colSpan = span; r.appendChild(c); }); thd.appendChild(r); };
    addTh('meta', [[`최고 이용자수 : ${fmt(s.peak != null ? s.peak : s.base)}`, 5]]);
    const t0 = rows.length ? rows[0][0] : s.base_t, tN = rows.length ? rows[rows.length - 1][0] : s.base_t;   // 날짜 범위 = 실제 줄(차트봇처럼)
    { const r = document.createElement('tr'); r.className = 'meta'; const c = h('th'); c.colSpan = 5; c.append(ds(t0), document.createTextNode(' ~ '), ds(tN)); r.appendChild(c); thd.appendChild(r); }
    addTh('cols', [['시간'], ['순위'], ['T100'], ['이용자수'], ['증감']]);
    tb.appendChild(thd);
    const tbd = document.createElement('tbody');
    const cell = (tr, x, cls) => { const c = h('td', cls || null, x); tr.appendChild(c); return c; };
    let prev = rows.length === 25 && all[0] && all[0][1] != null ? all[0][1] : null;   // 증감 = 마지막으로 보였던 값과의 차이(차트봇과 같게)
    rows.forEach((r, i) => {
      const t = r[0], u = r[1], rk = r[2], t1 = r[3], H = hr(t);
      const tr = document.createElement('tr');
      if (H >= 2 && H <= 6) tr.classList.add('night');
      if (rows.length - i > 12) tr.classList.add('old');      // 휴대폰에선 최근 12시간만 먼저
      cell(tr, `${H}시`, 't');
      cell(tr, rk != null ? String(rk) : '', 'r ' + rc(rk));
      cell(tr, t1 != null ? String(t1) : '', 'r ' + rc(t1));
      cell(tr, u != null ? fmt(u) : '', 'u' + (u != null && u === s.peak ? ' pk' : ''));
      const d = u != null && prev != null ? u - prev : null;
      cell(tr, d != null ? dtx(d) : '', 'd' + (d != null ? dcls(d) : ''));
      if (u != null) prev = u;
      tbd.appendChild(tr);
    });
    if (n1) {                                          // 다음 시간 예측 줄 — 순위 · T100 자리엔 '예측' 표시만
      const tr = document.createElement('tr'); tr.className = 'pred';
      const tc = cell(tr, `${hr(n1.t)}시`, 't');
      if (n1.t.slice(0, 10) !== tN.slice(0, 10)) tc.title = dlab(n1.t);
      const pc = cell(tr, '', 'pl'); pc.colSpan = 2; pc.appendChild(h('span', 'pill', '예측'));
      cell(tr, fmt(n1.med), 'u');
      const d = n1.med - s.base;
      cell(tr, dtx(d), 'd' + dcls(d));
      tbd.appendChild(tr);
    }
    tb.appendChild(tbd);
    p.appendChild(tb);
    const nOld = rows.filter((_, i) => rows.length - i > 12).length;
    if (nOld) {
      const bx = h('button', 'bx', `앞 ${nOld}시간 더 보기`); bx.type = 'button';
      bx.addEventListener('click', () => { p.classList.add('all'); bx.remove(); });
      p.appendChild(bx);
    }
    if (s.how === 'keep') p.appendChild(h('div', 'kn', '24시간 전 숫자가 없어서 지금 숫자를 그대로 적었어요.'));
    board.appendChild(p);
  });

  /* 곡별 그래프: 지난 48시간 + 앞으로 24시간 */
  const mult = document.getElementById('mult');
  const charts = [];
  S.forEach(s => {
    const box = h('div'); const h3 = h('h3'); const i = h('i'); i.style.background = col(s); h3.append(i, document.createTextNode(s.title)); box.appendChild(h3);
    const ch = h('div', 'chart'); const tip = h('div', 'tip'); ch.appendChild(tip); box.appendChild(ch); mult.appendChild(box);
    charts.push({ s, ch, tip });
  });
  function draw() {
    charts.forEach(({ s, ch, tip }) => {
      ch.querySelector('svg')?.remove();
      const W = ch.clientWidth || 300, H = 220, m = { t: 10, r: 8, b: 26, l: 44 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
      const times = s.hist.map(x => x[0]).concat(s.path.map(p => p.t));
      const act = s.hist.map(x => x[1]).concat(s.path.map(() => null));
      const med = s.hist.map(() => null).concat(s.path.map(p => p.med)); med[s.hist.length - 1] = s.base;
      const lo = s.hist.map(() => null).concat(s.path.map(p => p.lo)), hi = s.hist.map(() => null).concat(s.path.map(p => p.hi));
      const vals = [...act, ...med, ...lo, ...hi].filter(v => v != null);
      const vmin = Math.min(...vals), vmax = Math.max(...vals), span = Math.max(1000, vmax - vmin), step = niceStep(span);
      const y0 = Math.floor((vmin - span * .05) / step) * step, y1 = Math.ceil((vmax + span * .05) / step) * step;
      const N = times.length, X = i => m.l + i * pw / (N - 1), Y = v => m.t + ph * (1 - (v - y0) / (y1 - y0));
      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': s.title + ' 지난 48시간과 앞으로 24시간' });
      ch.prepend(svg);
      for (let v = y0; v <= y1 + 1e-6; v += step) { el('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: 'grid' }, svg); txt(svg, m.l - 6, Y(v) + 4, tickLab(v, step), 'tick', 'end'); }
      times.forEach((t, i) => { if (hr(t) === 0) { el('line', { x1: X(i), x2: X(i), y1: m.t, y2: m.t + ph, class: 'dayline' }, svg); txt(svg, X(i) + 3, m.t + ph + 16, `${+t.slice(5, 7)}.${t.slice(8, 10)}`, 'day', 'start'); } });
      const seg = []; const band = () => { if (seg.length > 1) { const pts = seg.map(i => `${X(i)},${Y(hi[i])}`).concat(seg.slice().reverse().map(i => `${X(i)},${Y(lo[i])}`)); const pg = el('polygon', { points: pts.join(' '), class: 'band' }, svg); pg.style.fill = col(s); } seg.length = 0; };
      times.forEach((t, i) => { if (lo[i] != null && hi[i] != null) seg.push(i); else band(); }); band();
      const line = (arr, cls) => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i) + ' ' + Y(v); pen = true; }); const p = el('path', { d, class: cls }, svg); p.style.stroke = col(s); };
      line(med, 'ln fc'); line(act, 'ln');
      const ni = s.hist.length - 1; el('line', { x1: X(ni), x2: X(ni), y1: m.t, y2: m.t + ph, class: 'now' }, svg); txt(svg, X(ni) + 4, m.t + 10, '지금', 'note');
      const c1 = el('circle', { cx: X(ni + 1), cy: Y(s.path[0].med), r: 4, class: 'dot' }, svg); c1.style.fill = col(s);
      const cross = el('line', { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, class: 'cross' }, svg);
      const hit = el('rect', { x: m.l, y: 0, width: pw, height: H, fill: 'transparent' }, svg);
      const show = ev => {
        const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
        const i = Math.max(0, Math.min(N - 1, Math.round((x - m.l) / (pw / (N - 1)))));
        cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.style.opacity = 1;
        tip.replaceChildren(h('div', 'hd', lab(times[i]) + (i > ni ? ' · 예측' : '')));
        if (i <= ni) tip.appendChild(h('div', null, act[i] == null ? '3위 밖(숫자 없음)' : `실제 ${fmt(act[i])}`));
        else { tip.appendChild(h('div', null, `예측 ${fmt(med[i])} (지금보다 ${sgn(med[i] - s.base)})`)); if (lo[i] != null) tip.appendChild(h('div', 'hd', `범위 ${fmt(lo[i])} ~ ${fmt(hi[i])}`)); }
        tip.classList.add('show');
        const bw = ch.clientWidth, tw = tip.offsetWidth; let left = X(i) + 12; if (left + tw > bw) left = X(i) - tw - 12; tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
      };
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', () => { cross.style.opacity = 0; tip.classList.remove('show'); });
    });
  }
  draw();
  let lastW = mult.clientWidth; window.addEventListener('resize', () => { if (mult.clientWidth !== lastW) { lastW = mult.clientWidth; draw(); } });

  /* 얼마나 맞았나 — 다음 시간 예측과 나중에 나온 실제 숫자 */
  const x1 = (D.stats || {})['정각 직후|1'] || (D.stats || {})['정각 직전|1'];
  document.getElementById('statSub').textContent = x1
    ? `지금까지 다음 시간 예측 ${x1.n}번을 실제 숫자와 맞춰 봤어요. 절반은 실제와 ${fmt(x1.mdae)}명 안쪽 차이였어요.` + (x1.dir != null ? ` 오르내림 방향은 ${x1.dir}% 맞혔고, 1,000명 안쪽으로 맞힌 게 ${x1.w1000}%예요.` : '')
    : '아직 맞춰 본 예측이 없어요. 다음 정각 숫자가 나오면 채워져요.';
  const seenR = new Set();
  const rec = (D.recent || []).slice().sort((a, b) => b.target_t.localeCompare(a.target_t) || b.made.localeCompare(a.made))
    .filter(e => { const k = e.target_t + '|' + e.key; if (seenR.has(k)) return false; seenR.add(k); return true; });   // 같은 시각 · 같은 곡은 마지막 예측 하나만
  const t = document.getElementById('recent');
  const RH = ['시각', '곡', '예측', '실제', '차이'];
  const head = document.createElement('tr'); RH.forEach(x => head.appendChild(h('th', null, x))); t.appendChild(head);
  rec.forEach(e => {
    const r = document.createElement('tr');
    [lab(e.target_t), e.title, fmt(e.pred), e.actual != null ? fmt(e.actual) : '나오기 전', e.actual != null ? fmt(Math.abs(e.actual - e.pred)) + '명' : ''].forEach((x, i) => { const c = h('td', null, String(x)); c.dataset.label = RH[i]; r.appendChild(c); });
    t.appendChild(r);
  });
  if (rec.length > 12) {     /* 휴대폰: 처음 12개만, 단추로 펼침 */
    const mb = document.getElementById('moreRecent');
    t.classList.add('short'); mb.classList.add('on');
    mb.addEventListener('click', () => { t.classList.remove('short'); mb.classList.remove('on'); });
  }
  /* 맨 아래 참고 지표(With · 백화요란) */
  const RF = D.ref || [], rfe = document.getElementById('refm');
  if (RF.length) {
    rfe.appendChild(h('div', null, '참고 지표 (보통 곡: 점유율 1%당 ' + fmt(RF[0].ref_conv) + '명 · 밤/낮 ' + RF[0].ref_nd + ')'));
    RF.forEach(x => rfe.appendChild(h('div', null, `${x.title.replace(/ \(.*\)$/, '')} — 점유율 1%당 24시간 이용자 ${fmt(x.conv)}명`
      + (x.conv_prev ? ` (하루 전 ${fmt(x.conv_prev)}명)` : '') + (x.nd != null ? ` · 밤/낮 점유율 ${x.nd}` : '')
      + (x.if_public ? ` · 보통 곡처럼 들었다면 약 ${fmt(x.if_public)}명` : ''))));
  }
  /*LOCAL_ONLY_JS*/
}).catch(e => { document.getElementById('lede').textContent = '예측 자료를 불러오지 못했어요. 잠시 뒤 새로 고쳐 주세요.'; });
</script>
</body>
</html>
